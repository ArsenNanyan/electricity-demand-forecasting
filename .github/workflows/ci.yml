name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Light subset — the test suite does not need torch/lightgbm (imported lazily).
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml scikit-learn fastapi "pydantic>=2" httpx pytest

      - name: Run tests
        run: pytest -q
