[project]
name = "electricity-forecast-benchmark"
version = "0.1.0"
description = "Benchmark of forecasting methods for 24-hour electricity demand (UCI ElectricityLoadDiagrams20112014)."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["src"]
